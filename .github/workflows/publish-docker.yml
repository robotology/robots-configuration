
name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MC version to build'
        required: true
        default: 'v7'
        type: choice
        options:
          - v6
          - v7
          - both

  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v6
            icub_main_ref: v2.12.3
            rplidar_ref: v1.1

          - version: v7
            icub_main_ref: devel
            rplidar_ref: yarp4

    steps:
    - uses: actions/checkout@main

    - name: Publish to Registry
      if: |
        (github.event_name == 'release' && matrix.version == 'v7') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.version == matrix.version || inputs.version == 'both'))
      uses: elgohr/Publish-Docker-Github-Action@v5
      env:
        DEPENDENCIES_DIR: '/dependencies'
        ICUB_MAIN_REF: ${{ matrix.icub_main_ref }}
        RPLIDAR_REF: ${{ matrix.rplidar_ref }}
      with:
        name: ${{ github.repository }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        workdir: tests/dockerfiles
        buildargs: DEPENDENCIES_DIR,ICUB_MAIN_REF,RPLIDAR_REF
        registry: ghcr.io
        tags: ${{ matrix.version }}

  cleanup:
    needs: publish
    runs-on: ubuntu-latest

    steps:
    - name: Clean up Registry from untagged images
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'robots-configuration'
        package-type: 'container'
        min-versions-to-keep: 0
        delete-only-untagged-versions: "true"
